<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnowBudget — Cyber Alpine Cockpit</title>
  
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/goals.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/animations.css">

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div id="cockpit-container">
    
    <!-- BARRA SUPERIOR HUD DE ESTADO -->
    <header class="hud-top-bar">
      <div class="system-status">
        <span class="pulse-dot"></span> COCKPIT SYSTEM ONLINE
      </div>
      <h1 class="hud-logo">SNOW<span>BUDGET</span></h1>
      <div class="powder-score-pill">
        POWDER SCORE: <strong id="score-val">87</strong>
      </div>
    </header>

    <!-- PANELES FLOTANTES HUD (ORGANIZADOS EN LA PARTE INFERIOR / MEDIA) -->
    <main class="hud-grid">
      
      <!-- Panel 1: Estado Económico / Contabilidad del Hogar -->
      <section class="hud-panel glow-cyan">
        <h2><span class="icon">❄</span> Contabilidad del Hogar</h2>
        <div class="telemetry-metrics">
          <div class="metric-box">
            <span class="label">Ingresos Mes</span>
            <span class="value cyan">2.400 €</span>
          </div>
          <div class="metric-box">
            <span class="label">Gastos Mes</span>
            <span class="value pink">1.290 €</span>
          </div>
        </div>
        <div class="metric-total">
          <span class="label">Disponible:</span> <span class="value green">1.110 €</span>
        </div>
      </section>

      <!-- Panel 2: Modo Aventura (Objetivos de Ahorro) -->
      <section class="hud-panel glow-blue">
        <h2><span class="icon">🏔</span> Modo Aventura (Objetivos)</h2>
        <div class="adventure-mini-content">
          <div class="goal-info">
            <span>Jones Flagship</span>
            <span class="cyan">1.500 € (25%)</span>
          </div>
          <div class="progress-bar-container">
            <div class="progress-bar" style="width: 25%;"></div>
            <div class="rider-icon" style="left: 25%;">🏂</div>
          </div>
          <span class="waypoint-label">📍 Hito: Primer Refugio</span>
        </div>
      </section>

      <!-- Panel 3: Logros Desbloqueados -->
      <section class="hud-panel glow-purple">
        <h2><span class="icon">🏆</span> Logros Activos</h2>
        <div class="achievement-preview">
          <span class="achievement-badge">🔥 Powder Master</span>
        </div>
      </section>

    </main>

    <!-- CONSOLA DE ACCIÓN INFERIOR -->
    <footer class="hud-footer-controls">
      <button class="cockpit-btn" id="btn-add-expense">➕ Añadir Gasto</button>
      <button class="cockpit-btn" id="btn-add-income">💰 Añadir Ingreso</button>
      <button class="cockpit-btn" id="btn-add-goal">🏔 Nuevo Objetivo</button>
    </footer>

  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
